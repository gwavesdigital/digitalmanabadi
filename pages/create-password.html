<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Set App Password · AP Schools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <header class="app-header" style="background: var(--primary-green); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">🔒</span>
        <div>
          <h1 style="font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; margin: 0;">Security Setup</h1>
          <p style="font-size: 0.7rem; opacity: 0.9; margin: 0;">Create Daily Password</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="../index.html" class="header-btn">🏠 Home</a>
      </div>
    </header>

    <main class="app-view" style="padding: 24px 20px;">
      <div class="card">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-dark); font-size: 1.3rem; margin-bottom: 6px;">Create Daily Password</h2>
        <p class="text-muted" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Set a secure passcode for quick daily logins on this device.</p>

        <form id="passwordForm" class="form-vertical" onsubmit="handlePasswordCreation(event)">
          <div class="form-group">
            <label for="adminPassword">App Password</label>
            <input type="password" id="adminPassword" placeholder="Enter 4+ digit passcode" required />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter passcode" required />
          </div>

          <button type="submit" class="btn btn-primary btn-xl" style="margin-top: 10px;">
            Save & Open Dashboard
          </button>
        </form>
      </div>
    </main>

    <!-- VALIASS Footer -->
    <footer class="app-footer">
      <p style="font-weight: 600; color: var(--primary-dark); margin-bottom: 6px;">An initiative of @VALIASS team</p>
      <div class="support-links">
        <a href="tel:8985361991" class="support-link support-call">📞 Call 8985361991</a>
        <a href="https://wa.me/918985361991?text=Hello%20VALIASS%20team,%20I%20need%20assistance." target="_blank" class="support-link support-whatsapp">💬 WhatsApp</a>
      </div>
    </footer>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function handlePasswordCreation(e) {
      e.preventDefault();
      const pass = document.getElementById('adminPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (pass !== confirmPass) {
        alert('Passwords do not match.');
        return;
      }
      if (pass.length < 4) {
        alert('Password must be at least 4 characters long.');
        return;
      }

      localStorage.setItem('ap_app_password', pass);
      alert('App password created successfully!');
      window.location.href = './dashboard.html';
    }
  </script>
</body>
</html>
