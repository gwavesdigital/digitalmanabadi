<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>AP Schools · Classroom E-Diary</title>

  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css" />
  
  <style>
    .premium-hero-card {
      background: linear-gradient(135deg, rgba(14,123,62,0.1) 0%, rgba(244,196,48,0.08) 100%);
      border: 1.5px solid rgba(14, 123, 62, 0.2);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(14, 123, 62, 0.05);
    }
    .subject-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      background: var(--surface-alt);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s ease;
    }
    .subject-row:focus-within {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(14, 123, 62, 0.08);
    }
    @media (max-width: 360px) {
      .subject-row {
        grid-template-columns: 90px 1fr;
      }
    }
    .seal-box {
      border: 2px dashed #1a73e8;
      background: linear-gradient(135deg, rgba(26, 115, 232, 0.04) 0%, rgba(26, 115, 232, 0.01) 100%);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      position: relative;
      margin: 16px 0;
      box-shadow: 0 4px 15px rgba(26, 115, 232, 0.05);
    }
    .blue-seal-stamp {
      width: 90px;
      height: 90px;
      border: 3.5px solid #1a73e8;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px auto;
      color: #1a73e8;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(26,115,232,0.25);
      transform: rotate(-6deg);
      background: rgba(255,255,255,0.95);
    }
    .whatsapp-preview-box {
      background: #E8F8EC;
      border: 1.5px solid rgba(32, 186, 90, 0.35);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.78rem;
      color: #0c5123;
      white-space: pre-wrap;
      font-family: monospace;
      margin-top: 10px;
      margin-bottom: 16px;
      max-height: 160px;
      overflow-y: auto;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <header class="app-header"></header>

    <main class="app-view">
      <!-- Premium Hero Header Card -->
      <div class="premium-hero-card">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 44px; height: 44px; background: var(--primary-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1px solid rgba(14,123,62,0.2);">
            📖
          </div>
          <div>
            <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-darker); font-size: 1.2rem; margin-bottom: 2px;">
              Classroom E-Diary
            </h2>
            <p style="font-size: 0.74rem; color: var(--text-muted);">
              Record daily lesson plans, subjects, and classroom updates.
            </p>
          </div>
        </div>
      </div>

      <div class="card" style="border-radius: 18px; padding: 20px;">
        <form id="ediary-form" class="form-vertical" onsubmit="event.preventDefault();">
          <!-- Date & Teacher Name -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="diary-date">Date</label>
              <input type="date" id="diary-date" required style="border-radius: 10px;" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="teacher-name">Teacher Name</label>
              <input type="text" id="teacher-name" placeholder="Enter your name" required style="border-radius: 10px;" />
            </div>
          </div>

          <!-- Class Selection -->
          <div class="form-group" style="margin-top: 12px;">
            <label for="class-select">Select Class</label>
            <select id="class-select" onchange="loadClassSubjects()" required style="border-radius: 10px; font-weight: 600;">
              <option value="" disabled selected>-- Choose Class --</option>
              <option value="1">Class 1</option>
              <option value="2">Class 2</option>
              <option value="3">Class 3</option>
              <option value="4">Class 4</option>
              <option value="5">Class 5</option>
            </select>
          </div>

          <!-- Dynamic Subjects Container -->
          <div style="margin-top: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label style="font-weight: 700; font-size: 0.82rem; color: var(--primary-darker);">Subjects & Topics Covered</label>
              <button type="button" onclick="addCustomSubjectRow()" class="header-btn" style="background: var(--primary-light); color: var(--primary-dark); border-color: rgba(14,123,62,0.3); font-size: 0.7rem; padding: 5px 10px; border-radius: 8px;">
                ➕ Add Subject
              </button>
            </div>
            <div id="subjects-container">
              <p style="font-size: 0.76rem; color: var(--text-muted); text-align: center; padding: 18px; background: var(--surface-alt); border-radius: 12px; border: 1.5px dashed var(--border-color);">
                Please select a class above to load subjects automatically.
              </p>
            </div>
          </div>

          <!-- Class Notes Box -->
          <div class="form-group" style="margin-top: 10px;">
            <label for="diary-notes">General Class Notes / Remarks (Optional)</label>
            <textarea id="diary-notes" rows="3" placeholder="Enter special remarks or activities (leave blank if none)..." style="border-radius: 10px;"></textarea>
          </div>

          <!-- Action Buttons 1: Save & Get Seal -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;">
            <button type="button" onclick="saveDiaryForm()" class="btn" style="background: var(--surface-alt); color: var(--primary-dark); border: 1.5px solid var(--border-color); font-size: 0.85rem; padding: 12px; border-radius: 12px;">
              💾 Save / Clear
            </button>
            <button type="button" onclick="generateHMSeal()" class="btn btn-primary" style="font-size: 0.85rem; padding: 12px; border-radius: 12px;">
              🔏 Get HM Seal
            </button>
          </div>
        </form>

        <!-- HM Seal Preview Box (Hidden initially) -->
        <div id="seal-display-section" class="seal-box hidden">
          <p style="font-size: 0.72rem; font-weight: 700; color: #1a73e8; margin-bottom: 2px; letter-spacing: 0.5px;">OFFICIAL HEAD MASTER VERIFICATION</p>
          <div class="blue-seal-stamp">
            <span style="font-size: 0.6rem;">GOVT. A.P.</span>
            <span style="font-size: 0.5rem; margin-top: 2px;">★ VERIFIED ★</span>
            <span style="font-size: 0.45rem;">OFFICIAL SEAL</span>
          </div>
          <p style="font-size: 0.78rem; color: var(--text-color); font-weight: 700;" id="seal-hm-name">HM: --</p>
          <p style="font-size: 0.7rem; color: var(--text-muted);" id="seal-timestamp">Time: --</p>
        </div>

        <!-- Post-Seal Actions -->
        <div id="post-seal-actions" class="hidden" style="margin-top: 16px;">
          <label style="font-weight: 700; font-size: 0.82rem; color: var(--primary-darker); margin-bottom: 6px; display: block;">WhatsApp Formatted Message Preview:</label>
          <div id="whatsapp-text-preview" class="whatsapp-preview-box"></div>

          <div style="display: flex; flex-direction: column; gap: 10px;">
            <button type="button" onclick="shareToWhatsApp()" class="btn" style="background: #25D366; color: white; font-size: 0.95rem; padding: 14px; border-radius: 12px; box-shadow: 0 4px 15px rgba(37,211,102,0.3); font-weight: 700;">
              💬 Share to WhatsApp Group
            </button>
            <button type="button" onclick="createDiaryPoster()" class="btn btn-primary" style="font-size: 0.95rem; padding: 14px; border-radius: 12px; background: linear-gradient(135deg, #095C2D 0%, #063D1E 100%); font-weight: 700;">
              🎨 Create & Download Premium Poster (PNG)
            </button>
          </div>
        </div>

      </div>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="../js/app.js"></script>
  <script>
    let isSealGenerated = false;

    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('ap_app_password')) {
        window.location.href = './login.html';
        return;
      }
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('diary-date').value = today;

      const savedTeacher = localStorage.getItem('ap_last_teacher') || '';
      if (savedTeacher) {
        document.getElementById('teacher-name').value = savedTeacher;
      }
    });

    function loadClassSubjects() {
      const classNum = document.getElementById('class-select').value;
      const container = document.getElementById('subjects-container');
      container.innerHTML = '';

      let defaultSubjects = [];
      if (classNum === '1' || classNum === '2') {
        defaultSubjects = ['Telugu', 'English', 'Maths'];
      } else {
        defaultSubjects = ['Telugu', 'English', 'Maths', 'EVS'];
      }

      defaultSubjects.forEach((sub) => {
        container.innerHTML += `
          <div class="subject-row">
            <input type="text" value="${sub}" readonly style="background: var(--surface); font-weight: 700; font-size: 0.85rem; border: none; color: var(--primary-dark);" />
            <input type="text" class="subject-topic-input" placeholder="Enter topic/lesson covered..." required style="border-radius: 8px; padding: 8px 10px;" />
          </div>
        `;
      });
    }

    function addCustomSubjectRow() {
      const container = document.getElementById('subjects-container');
      const rowDiv = document.createElement('div');
      rowDiv.className = 'subject-row';
      rowDiv.innerHTML = `
        <input type="text" class="subject-name-input" placeholder="Subject Name" required style="font-weight: 700; font-size: 0.85rem; border-radius: 8px; padding: 8px 10px;" />
        <div style="display: flex; gap: 6px;">
          <input type="text" class="subject-topic-input" placeholder="Enter topic/lesson..." required style="flex:1; border-radius: 8px; padding: 8px 10px;" />
          <button type="button" onclick="this.parentElement.parentElement.remove()" class="header-btn" style="background: #ffebee; color: #c62828; border-color: rgba(198,40,40,0.3); padding: 0 10px; border-radius: 8px;">❌</button>
        </div>
      `;
      container.appendChild(rowDiv);
    }

    function saveDiaryForm() {
      const teacher = document.getElementById('teacher-name').value;
      if (teacher) localStorage.setItem('ap_last_teacher', teacher);
      alert('E-Diary form data saved successfully!');
    }

    function generateHMSeal() {
      const classNum = document.getElementById('class-select').value;
      const teacher = document.getElementById('teacher-name').value;
      if (!classNum) {
        alert('Please select a class first.');
        return;
      }
      if (!teacher) {
        alert('Please enter the Teacher Name.');
        return;
      }

      const hmName = localStorage.getItem('ap_hm_name') || 'Head Master';
      const now = new Date();
      const timeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      document.getElementById('seal-hm-name').textContent = `Head Master: ${hmName}`;
      document.getElementById('seal-timestamp').textContent = `Approved On: ${timeStr}`;

      document.getElementById('seal-display-section').classList.remove('hidden');
      document.getElementById('post-seal-actions').classList.remove('hidden');
      isSealGenerated = true;

      buildWhatsAppText(hmName, timeStr);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function buildWhatsAppText(hmName, timeStr) {
      const school = localStorage.getItem('ap_school_name') || 'AP School';
      const date = document.getElementById('diary-date').value;
      const teacher = document.getElementById('teacher-name').value;
      const classNum = document.getElementById('class-select').value;
      const notes = document.getElementById('diary-notes').value.trim();

      let subjectsText = '';
      const rows = document.querySelectorAll('.subject-row');
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const subName = inputs[0].value || inputs[0].placeholder;
        const topic = inputs[inputs.length - 1].value || '(No update)';
        subjectsText += `• *${subName}*: ${topic}\n`;
      });

      let notesSection = '';
      if (notes !== '') {
        notesSection = `📝 *Notes*: ${notes}\n\n`;
      }

      const message = `🏫 *AP SCHOOLS E-DIARY* 🍎\n` +
        `📍 *School*: ${school}\n` +
        `📅 *Date*: ${date} | *Class*: Class ${classNum}\n` +
        `👨‍🏫 *Teacher*: ${teacher}\n\n` +
        `📚 *Topics Covered*:\n${subjectsText}\n` +
        `${notesSection}` +
        `🔏 *HM Approved*: ${hmName} (${timeStr})\n` +
        `✨ An initiative of @VALIASS team for AP Schools`;

      document.getElementById('whatsapp-text-preview').textContent = message;
      window.whatsappShareMessage = message;
    }

    function shareToWhatsApp() {
      if (!isSealGenerated) {
        alert('Please get the Head Master Seal first.');
        return;
      }
      const encoded = encodeURIComponent(window.whatsappShareMessage || 'AP Schools E-Diary Report');
      window.open(`https://wa.me/?text=${encoded}`, '_blank');
    }

    function createDiaryPoster() {
      if (!isSealGenerated) {
        alert('Please get the Head Master Seal first before creating the poster.');
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 1130;
      const ctx = canvas.getContext('2d');

      // 1. Premium Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 800, 1130);
      bgGrad.addColorStop(0, '#FFFFFF');
      bgGrad.addColorStop(1, '#F2FAF5');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 800, 1130);

      // 2. Rich Emerald Header Banner
      ctx.fillStyle = '#0E7B3E';
      ctx.fillRect(0, 0, 800, 140);

      const logoImg = new Image();
      logoImg.crossOrigin = 'anonymous';
      logoImg.src = '../assets/icon-192.png';
      
      logoImg.onload = function() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(70, 70, 42, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(logoImg, 28, 28, 84, 84);
        ctx.restore();

        ctx.strokeStyle = '#F4C430';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(70, 70, 42, 0, Math.PI * 2);
        ctx.stroke();

        renderPremiumPosterContent(ctx);
      };

      logoImg.onerror = function() {
        renderPremiumPosterContent(ctx);
      };
    }

    function renderPremiumPosterContent(ctx) {
      // Header Title & Subtitle
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 26px "Playfair Display", serif';
      ctx.textAlign = 'left';
      ctx.fillText('GOVERNMENT OF ANDHRA PRADESH', 135, 55);
      
      ctx.font = '16px Inter, sans-serif';
      ctx.fillStyle = '#E6F4EC';
      ctx.fillText('AP Schools Digital Classroom E-Diary System', 135, 88);

      // Gold Accent Ribbon
      ctx.fillStyle = '#F4C430';
      ctx.fillRect(0, 140, 800, 6);

      // 3. School Details Box (Card)
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = '#D2DCD6';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(50, 170, 700, 115, 14);
      ctx.fill();
      ctx.stroke();

      const school = localStorage.getItem('ap_school_name') || 'AP Model School';
      const district = localStorage.getItem('ap_district') || '';
      const mandal = localStorage.getItem('ap_mandal') || '';
      const village = localStorage.getItem('ap_village') || '';

      ctx.fillStyle = '#063D1E';
      ctx.font = 'bold 22px "Playfair Display", serif';
      ctx.fillText(school, 80, 212);

      ctx.fillStyle = '#6B7A72';
      ctx.font = '14px Inter, sans-serif';
      ctx.fillText(`Location: ${village}, ${mandal} Mandal, ${district} Dist.`, 80, 242);

      const date = document.getElementById('diary-date').value;
      const classNum = document.getElementById('class-select').value;
      const teacher = document.getElementById('teacher-name').value;
      ctx.fillText(`Date: ${date}   |   Class: Class ${classNum}   |   Teacher: ${teacher}`, 80, 268);

      // 4. Subjects Card (Dynamic height depending on notes)
      const notes = document.getElementById('diary-notes').value.trim();
      const hasNotes = notes !== '';
      const contentCardHeight = hasNotes ? 400 : 490;

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(50, 305, 700, contentCardHeight, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#0E7B3E';
      ctx.font = 'bold 20px "Playfair Display", serif';
      ctx.fillText('📚 Daily Class Subjects & Topics Covered', 80, 345);

      ctx.fillStyle = '#14201A';
      ctx.font = '16px Inter, sans-serif';
      
      let yPos = 390;
      const rows = document.querySelectorAll('.subject-row');
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const subName = inputs[0].value || inputs[0].placeholder;
        const topic = inputs[inputs.length - 1].value || '(No update)';
        
        ctx.fillStyle = '#095C2D';
        ctx.font = 'bold 16px Inter, sans-serif';
        ctx.fillText(`• ${subName}:`, 80, yPos);
        
        ctx.fillStyle = '#14201A';
        ctx.font = '16px Inter, sans-serif';
        ctx.fillText(topic, 220, yPos);
        
        yPos += 38;
      });

      // Conditional Notes Box on Poster (Only renders if user entered notes)
      let sealBoxY = 815;
      if (hasNotes) {
        ctx.fillStyle = '#F2FAF5';
        ctx.beginPath();
        ctx.roundRect(80, 715, 640, 75, 10);
        ctx.fill();

        ctx.fillStyle = '#0E7B3E';
        ctx.font = 'bold 14px "Playfair Display", serif';
        ctx.fillText('📝 Notes / Remarks:', 100, 740);

        ctx.fillStyle = '#14201A';
        ctx.font = '14px Inter, sans-serif';
        ctx.fillText(notes.substring(0, 85), 100, 768);
        sealBoxY = 815;
      } else {
        sealBoxY = 730;
      }

      // 5. Official HM Seal & Stamp Box (Cinematic View)
      ctx.fillStyle = '#F2FAF5';
      ctx.strokeStyle = 'rgba(14,123,62,0.2)';
      ctx.beginPath();
      ctx.roundRect(50, sealBoxY, 700, 215, 14);
      ctx.fill();
      ctx.stroke();

      // Draw Professional Blue Official Seal Stamp on right
      ctx.save();
      ctx.translate(620, sealBoxY + 108);
      ctx.rotate(-0.08);
      
      ctx.strokeStyle = '#1a73e8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 58, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, 48, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#1a73e8';
      ctx.font = 'bold 10px "Playfair Display", serif';
      ctx.textAlign = 'center';
      ctx.fillText('GOVT. OF A.P.', 0, -16);
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.fillText('★ VERIFIED ★', 0, 4);
      ctx.font = 'bold 9px "Playfair Display", serif';
      ctx.fillText('OFFICIAL SEAL', 0, 22);
      ctx.restore();

      ctx.fillStyle = '#063D1E';
      ctx.font = 'bold 18px "Playfair Display", serif';
      ctx.textAlign = 'left';
      ctx.fillText('Head Master Verification & Official Seal', 80, sealBoxY + 40);

      ctx.fillStyle = '#14201A';
      ctx.font = '15px Inter, sans-serif';
      const hmName = localStorage.getItem('ap_hm_name') || 'Head Master';
      const timeStr = document.getElementById('seal-timestamp').textContent.replace('Approved On: ', '');
      ctx.fillText(`Head Master Name: ${hmName}`, 80, sealBoxY + 85);
      ctx.fillText(`Approval Timestamp: ${timeStr}`, 80, sealBoxY + 120);
      ctx.fillText('Status: Digitally Verified & Approved by School Authority', 80, sealBoxY + 155);

      // 6. Footer brand
      ctx.fillStyle = '#6B7A72';
      ctx.font = '13px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('An initiative of @VALIASS team for AP Schools', 400, 1075);

      const link = document.createElement('a');
      link.download = `AP-Schools-EDiary-${date}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
