<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Mana Badi</title>
    <!-- Your original stylesheet preserving your exact theme and color codes -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Digital Mana Badi</h2>
            <p>Enter your 4-digit security PIN</p>

            <!-- Original PIN Input and container -->
            <div class="input-group">
                <input type="password" id="pinInput" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••">
            </div>

            <!-- Red attempts error feedback indicator (appears only on incorrect PIN entry) -->
            <div id="attemptError" style="color: #d9534f; font-size: 0.85rem; margin-top: 10px; display: none; text-align: center; font-weight: 500;"></div>

            <div class="actions" style="margin-top: 20px;">
                <button type="button" id="loginBtn" class="btn-submit">Login</button>
            </div>

            <div class="links" style="margin-top: 15px; text-align: center;">
                <a href="reset.html" style="font-size: 0.85rem; text-decoration: none; color: #666;">Forgot PIN / Reset?</a>
            </div>
        </div>
    </div>

    <script>
        // Track failed attempts out of 5 allowed
        let failedAttempts = parseInt(localStorage.getItem("login_failed_attempts") || "0");
        const maxAttempts = 5;

        const pinInput = document.getElementById("pinInput");
        const loginBtn = document.getElementById("loginBtn");
        const attemptError = document.getElementById("attemptError");

        // Focus input automatically on load
        pinInput.focus();

        pinInput.addEventListener("input", (e) => {
            const val = e.target.value.replace(/\D/g, "");
            pinInput.value = val;

            // Clear error warning as soon as user types
            attemptError.style.display = "none";
            pinInput.style.borderColor = "";

            if (val.length === 4) {
                validatePin(val);
            }
        });

        if (loginBtn) {
            loginBtn.addEventListener("click", () => {
                validatePin(pinInput.value);
            });
        }

        function validatePin(enteredPin) {
            // Fixed password logic: check against your stored setup PIN (defaults to "1234" if not configured)
            const savedPin = localStorage.getItem("app_pin") || localStorage.getItem("school_pin") || "1234";

            if (enteredPin === savedPin) {
                // Success: reset attempts counter and open dashboard
                localStorage.setItem("login_failed_attempts", "0");
                attemptError.style.display = "none";
                window.location.href = "dashboard.html";
            } else {
                // Failure: increment attempt count up to 5
                failedAttempts++;
                localStorage.setItem("login_failed_attempts", failedAttempts);

                const remaining = maxAttempts - failedAttempts;

                // Highlight border/dots red and display the wrong attempt warning
                pinInput.style.borderColor = "#d9534f";
                
                if (remaining > 0) {
                    attemptError.style.display = "block";
                    attemptError.textContent = `Wrong attempt ${failedAttempts} of ${maxAttempts} over! (${remaining} attempt(s) left)`;
                } else {
                    attemptError.style.display = "block";
                    attemptError.textContent = `Maximum ${maxAttempts} wrong attempts reached. Locked temporarily.`;
                    pinInput.disabled = true;
                    if (loginBtn) loginBtn.disabled = true;

                    setTimeout(() => {
                        window.location.href = "reset.html";
                    }, 2000);
                }

                // Clear input after a brief moment for retry
                setTimeout(() => {
                    pinInput.value = "";
                }, 500);
            }
        }
    </script>
</body>
</html>
