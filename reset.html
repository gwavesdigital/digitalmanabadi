<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>AP Schools · Reset Password</title>

  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <header class="app-header"></header>

    <main class="app-view">
      <div class="card">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--primary-darker); margin-bottom: 4px;">Reset Password</h2>
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px;">Enter your VALIASS Secret Code and set a new 4-digit PIN.</p>

        <form id="reset-form" onsubmit="handlePasswordReset(event)" class="form-vertical">
          <div class="form-group">
            <label for="reset-secret">VALIASS Secret Code</label>
            <input type="password" id="reset-secret" placeholder="Enter secret code from team" required />
          </div>

          <div class="form-group">
            <label for="new-pass">New 4-Digit PIN</label>
            <input type="password" id="new-pass" placeholder="Enter new 4-digit numbers only" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Update Password →
          </button>
        </form>

        <!-- Contact VALIASS Team Box -->
        <div style="margin-top: 14px; text-align: center; background: var(--primary-soft); padding: 12px; border-radius: 10px; border: 1px solid rgba(14,123,62,0.15);">
          <p style="font-size: 0.75rem; color: var(--primary-dark); font-weight: 600; margin-bottom: 8px;">Contact VALIASS team to get your secret code:</p>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <a href="tel:8985361991" class="btn" style="background: var(--surface); color: var(--primary-dark); font-size: 0.75rem; padding: 8px; border: 1px solid var(--border-color);">📞 Call VALIASS Team</a>
            <a href="https://wa.me/918985361991?text=Help%20to%20reset%20app%20password" target="_blank" class="btn" style="background: #E8F8EC; color: #20BA5A; font-size: 0.75rem; padding: 8px; border: 1px solid rgba(32,186,90,0.3);">💬 WhatsApp VALIASS (Help to reset app password)</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function handlePasswordReset(e) {
      e.preventDefault();
      const secretCode = document.getElementById('reset-secret').value;
      const newPass = document.getElementById('new-pass').value;

      if (!verifySchoolActivation(secretCode)) {
        alert('Invalid VALIASS Secret Code. Please contact VALIASS team for the correct code.');
        return;
      }

      localStorage.setItem('ap_app_password', newPass);
      localStorage.removeItem('ap_failed_attempts');
      localStorage.removeItem('ap_lockout_time');
      
      alert('Password successfully reset! Please login with your new PIN.');
      window.location.href = './login.html';
    }
  </script>
</body>
</html>
